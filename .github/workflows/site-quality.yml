name: Static site quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static SEO, sitemap, and links
        run: python scripts/site_audit.py
      - name: Check backend Python syntax
        run: python -m compileall -q tools/domain-risk-scan/app
      - name: Install offline security test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test target validation without external network
        working-directory: tools/domain-risk-scan
        run: python -m pytest tests/test_host_validation.py -q
