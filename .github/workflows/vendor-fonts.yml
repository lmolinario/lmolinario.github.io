name: Vendor licensed web fonts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-fonts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-fonts
  cancel-in-progress: false

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve versioned OFL-licensed font packages
        run: |
          mkdir -p /tmp/fontsource-packages assets/fonts
          npm install --prefix /tmp/fontsource-packages --no-audit --no-fund --ignore-scripts --no-package-lock @fontsource-variable/dm-sans@5.3.0 @fontsource/instrument-serif@5.3.0
          cp /tmp/fontsource-packages/node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2 assets/fonts/dm-sans-latin-wght-normal.woff2
          cp /tmp/fontsource-packages/node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2 assets/fonts/instrument-serif-latin-400-italic.woff2
          cp /tmp/fontsource-packages/node_modules/@fontsource-variable/dm-sans/OFL.txt assets/fonts/DM-Sans-OFL.txt
          cp /tmp/fontsource-packages/node_modules/@fontsource/instrument-serif/OFL.txt assets/fonts/Instrument-Serif-OFL.txt
          test -s assets/fonts/dm-sans-latin-wght-normal.woff2
          test -s assets/fonts/instrument-serif-latin-400-italic.woff2
      - name: Commit self-hosted font files
        run: |
          git add assets/fonts/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Vendor OFL fonts for privacy and stable loading"
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 4
            done
            exit 1
          fi
