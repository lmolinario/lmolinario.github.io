name: Browser QA and Lighthouse
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_ui.cjs'
      - '.github/workflows/browser-qa.yml'
      - 'assets/site.css'
      - 'assets/app-editorial.css'
      - 'publications/index.html'
      - 'index.html'

permissions:
  contents: read

concurrency:
  group: portfolio-browser-qa
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight Playwright driver
        run: |
          npm install --prefix /tmp/portfolio-qa --no-audit --no-fund --ignore-scripts --no-package-lock playwright-core@1.56.1
          which google-chrome || which chromium || which chromium-browser
      - name: Serve static site on loopback
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/portfolio-server.log 2>&1 &
          echo $! >/tmp/portfolio-server.pid
          for i in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
      - name: Validate interactive UI on desktop and mobile
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/verify_ui.cjs
      - name: Lab performance and accessibility reports
        if: always()
        run: |
          mkdir -p audit-artifacts
          npm install --prefix /tmp/portfolio-lighthouse --no-audit --no-fund --ignore-scripts --no-package-lock lighthouse@12.8.2
          /tmp/portfolio-lighthouse/node_modules/.bin/lighthouse http://127.0.0.1:8765/ --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=audit-artifacts/lighthouse-mobile.json --only-categories=performance,accessibility,best-practices,seo --quiet
          /tmp/portfolio-lighthouse/node_modules/.bin/lighthouse http://127.0.0.1:8765/ --preset=desktop --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=audit-artifacts/lighthouse-desktop.json --only-categories=performance,accessibility,best-practices,seo --quiet
          python - <<'PY'
          import json,os
          for device in ('mobile','desktop'):
              with open(f'audit-artifacts/lighthouse-{device}.json') as f: report=json.load(f)
              categories={k:round((v.get('score') or 0)*100) for k,v in report['categories'].items()}
              print(device,categories)
              refs=report['categories']['accessibility']['auditRefs']
              issues=[(x['id'], report['audits'][x['id']].get('title',''), report['audits'][x['id']].get('score')) for x in refs if x.get('weight',0)>0 and report['audits'].get(x['id'],{}).get('score',1)<1]
              print('Accessibility findings:',issues)
              contrast=report['audits'].get('color-contrast',{}).get('details',{}).get('items',[])
              for item in contrast[:25]:
                  node=item.get('node',{})
                  print('Contrast node:', {'selector':node.get('selector'), 'text':node.get('snippet'), 'ratio':item.get('contrastRatio'), 'explanation':item.get('explanation')})
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(f"### {device.title()} Lighthouse (local lab)\n{categories}\nAccessibility findings: {issues}\n\n")
          PY
      - name: Preserve screenshots and Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-ui-lighthouse
          path: audit-artifacts/
          if-no-files-found: warn
